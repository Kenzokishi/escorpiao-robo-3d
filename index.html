<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Escorpião-robô 3D — anatomia mecânica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#e6dfd3;overflow:hidden;font-family:Inter,system-ui,sans-serif}
#app{--ink:#1f2226;--mut:#777066;--line:rgba(40,35,30,.15);--panel:rgba(255,255,255,.8);--txt:#2d3035;--strong:#000;--btn:rgba(255,255,255,.55);--acc:#f26b1d;
  color:var(--ink);height:100%;height:100vh;height:100dvh;min-height:540px;display:flex;flex-direction:column;
  background:radial-gradient(120% 70% at 50% 42%,#f7f3ec 0%,#ebe4d8 58%,#ddd4c5 100%);transition:background .6s}
#app.night{--ink:#e9eef4;--mut:#9aa6b4;--line:rgba(200,220,240,.15);--panel:rgba(14,19,25,.9);--txt:#d8e0e9;--strong:#fff;--btn:rgba(220,235,255,.06);
  background:radial-gradient(120% 70% at 50% 42%,#1b2230 0%,#0b0f17 60%,#04060a 100%)}
header{padding:12px 14px 6px;display:flex;flex-direction:column;gap:9px;max-width:900px;width:100%;margin:0 auto}
.ttl{display:flex;align-items:baseline;gap:9px}
h1{white-space:nowrap;font-family:'Chakra Petch',sans-serif;font-size:clamp(19px,5.6vw,24px);font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.ttl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut);font-size:12.5px;font-family:'Chakra Petch',sans-serif;letter-spacing:.4px;text-transform:uppercase}
.tools,.views,#chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar,.views::-webkit-scrollbar,#chips::-webkit-scrollbar{display:none}
.tb{flex:0 0 auto;border:1px solid var(--line);background:var(--btn);color:var(--ink);font:600 12.5px 'Chakra Petch',sans-serif;letter-spacing:.5px;text-transform:uppercase;padding:7px 11px;border-radius:6px;cursor:pointer;transition:background .2s,color .2s}
.tb[aria-pressed="true"]{background:var(--ink);color:#f4efe7;border-color:var(--ink)}
#app.night .tb[aria-pressed="true"]{color:#0c1015}
.tb.go{border-color:var(--acc);color:var(--acc)}
.tb.go[aria-pressed="true"]{background:var(--acc);color:#fff}
#stage{position:relative;flex:1;min-height:280px}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;transform:translate(-50%,calc(-100% - 10px));font:600 11px 'Chakra Petch',sans-serif;letter-spacing:.5px;text-transform:uppercase;padding:4px 8px;border-radius:4px;background:var(--panel);border:1px solid var(--c);color:var(--ink);white-space:nowrap;opacity:0;transition:opacity .25s}
.lbl.show{opacity:1}
.lbl::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:7px;background:var(--c)}
.lbl i{position:absolute;left:50%;top:calc(100% + 8px);width:6px;height:6px;margin-left:-3px;border-radius:1px;background:var(--c)}
#asm{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:520px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 8px;backdrop-filter:blur(6px)}
#asm button{flex:0 0 auto;width:32px;height:32px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:17px;cursor:pointer}
#asm .mid{flex:1;min-width:0}
#stepTxt{font:600 12px 'Chakra Petch',sans-serif;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
#stepTxt span{color:var(--mut);font-weight:500}
#slider{width:100%;accent-color:var(--acc);height:18px;display:block}
.views{position:absolute;left:0;right:0;bottom:8px;padding:0 12px}
.vw{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 11px 'Chakra Petch',sans-serif;letter-spacing:.6px;text-transform:uppercase;padding:6px 10px;border-radius:4px;cursor:pointer}
.vw.on{background:var(--acc);border-color:var(--acc);color:#fff}
.vlab{flex:0 0 auto;align-self:center;font:600 10px 'Chakra Petch',sans-serif;letter-spacing:.8px;color:var(--mut);text-transform:uppercase}
#hint{position:absolute;left:50%;bottom:48px;transform:translateX(-50%);font-size:12px;color:var(--mut);background:var(--panel);padding:5px 10px;border-radius:999px;white-space:nowrap;pointer-events:none;transition:opacity .6s}
#err{position:absolute;inset:0;display:flex;z-index:5;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--mut);font-family:'Chakra Petch',sans-serif}
#panel{padding:0 12px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;max-width:900px;width:100%;margin:0 auto}
#card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c,var(--ink));border-radius:8px;padding:12px 14px 13px;max-height:34vh;overflow:auto;backdrop-filter:blur(6px)}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.badge{font:700 10px 'Chakra Petch',sans-serif;letter-spacing:.8px;text-transform:uppercase;padding:3px 7px;border-radius:3px;color:#fff;background:var(--c);flex:0 0 auto}
#card h2{font-family:'Chakra Petch',sans-serif;font-size:19px;font-weight:700;line-height:1.15;letter-spacing:.4px;text-transform:uppercase}
#card p{color:var(--txt);font-size:14px;line-height:1.47}
#card p b{color:var(--strong);font-weight:600}
#card p.mech{margin-top:8px;color:var(--mut);font-size:13px;line-height:1.4}
#card p.mech b{color:var(--acc)}
.specs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.specs span{font:600 11px 'Chakra Petch',sans-serif;letter-spacing:.4px;text-transform:uppercase;border:1px solid var(--line);border-radius:3px;padding:3px 7px;color:var(--ink)}
.nav{margin-left:auto;display:flex;gap:5px;flex:0 0 auto}
.nav button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:15px;cursor:pointer}
.tg{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tg button{border:1px solid var(--c);background:transparent;color:var(--ink);font:500 12.5px Inter,sans-serif;padding:6px 10px;border-radius:6px;cursor:pointer;text-align:left}
.tg button b{display:block;color:var(--c);font:700 11px 'Chakra Petch',sans-serif;letter-spacing:.6px;text-transform:uppercase;margin-bottom:1px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--btn);color:var(--ink);font:600 12.5px 'Chakra Petch',sans-serif;letter-spacing:.4px;text-transform:uppercase;padding:7px 11px;border-radius:6px;display:flex;align-items:center;gap:6px;cursor:pointer}
.chip i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.chip.on{background:var(--c);color:#fff;border-color:var(--c)}
.chip.on i{background:#fff}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="ttl"><h1>Escorpião-robô</h1><span>anatomia mecânica</span></div>
    <div class="tools">
      <button class="tb go" id="bBuild" aria-pressed="false">▶ Montar</button>
      <button class="tb go" id="bBreak" aria-pressed="false">Desmontar</button>
      <button class="tb" id="bLabels" aria-pressed="false">Nomes</button>
      <button class="tb" id="bRegion" aria-pressed="false">Cores por região</button>
      <button class="tb" id="bNight" aria-pressed="false">Modo noturno</button>
      <button class="tb" id="bRot" aria-pressed="true">Girar</button>
      <button class="tb" id="bSnd" aria-pressed="true">Som</button>
    </div>
  </header>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="labels"></div>
    <div id="asm"><button id="sPrev" aria-label="Passo anterior">‹</button><div class="mid"><div id="stepTxt"></div><input type="range" id="slider" min="0" max="11" step="0.01" value="0" aria-label="Progresso da montagem"></div><button id="sNext" aria-label="Próximo passo">›</button></div>
    <div id="hint">Arraste para girar · pinça para zoom · toque numa peça</div>
    <div class="views" id="views"><span class="vlab">Vista</span></div>
    <div id="err">Carregando o modelo 3D…</div>
  </div>
  <section id="panel">
    <div id="card"></div>
    <div id="chips"></div>
  </section>
</div>
<script>
const errEl=document.getElementById('err');
function fail(msg){errEl.style.display='flex';errEl.textContent=msg;}
window.addEventListener('error',e=>fail('Erro ao montar o modelo: '+(e.message||e)));
(function load(urls){
  if(!urls.length){fail('Não foi possível carregar o motor 3D. Verifique a conexão e recarregue a página.');return;}
  const sc=document.createElement('script');sc.src=urls[0];
  sc.onload=()=>{if(window.THREE){errEl.style.display='none';try{init();}catch(e){fail('Erro ao montar o modelo: '+e.message);}}else load(urls.slice(1));};
  sc.onerror=()=>load(urls.slice(1));
  document.head.appendChild(sc);
})(['https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js','https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js','https://unpkg.com/three@0.128.0/build/three.min.js']);

function init(){
const V3=THREE.Vector3, PI=Math.PI, UP=new V3(0,1,0);

/* ================= Conteúdo ================= */
const TAG={P:{name:'Prossoma',color:'#f26b1d'},M:{name:'Mesossoma',color:'#1f95c9'},T:{name:'Metassoma',color:'#d23c5a'}};
const PARTS=[
 {key:'carapaca',name:'Carapaça',tag:'P',region:'#f26b1d',
  text:'Placa dura que cobre o <b>prossoma</b> (cefalotórax), a parte da frente do corpo. Por baixo dela ficam o cérebro, a boca e os músculos que movem as pinças e os 4 pares de pernas.',
  mech:'Capô blindado da cabine de comando, com placa de reforço e saídas de ventilação.',spec:['Blindagem 40 mm','Massa 120 kg'],
  view:{theta:0.7,phi:0.8,rf:0.55},anchor:[0.6,1.98,2.1]},
 {key:'olhos',name:'Olhos',tag:'P',region:'#ffb347',
  text:'Um par de <b>olhos medianos</b> no alto da carapaça e de 2 a 5 pares de <b>olhos laterais</b> nas bordas da frente. Não formam imagens nítidas, mas são tão sensíveis que funcionam até com a luz das estrelas.',
  mech:'Torre com 2 câmeras centrais e 3 pares de sensores na frente do capô.',spec:['8 sensores','Alcance 300 m'],
  view:{theta:0.3,phi:1.0,rf:0.38},anchor:[0,2.2,2.55]},
 {key:'queliceras',name:'Quelíceras',tag:'P',region:'#ff9a40',
  text:'Pequenas pinças na frente da boca. <b>Não têm veneno</b>: rasgam e trituram a presa. A digestão começa fora do corpo, e o escorpião suga o alimento já liquefeito.',
  mech:'Mandíbulas trituradoras na entrada do sistema de alimentação.',spec:['Torque 900 N·m','Lâminas de aço'],
  view:{theta:0.25,phi:1.25,rf:0.34},anchor:[0.22,0.92,3.5]},
 {key:'pedipalpos',name:'Pedipalpos',tag:'P',region:'#e05a12',
  text:'O segundo par de apêndices: <b>coxa, trocânter, fêmur e patela</b>, terminando na pinça. São cobertos de <b>tricobótrias</b>, pelos finíssimos que captam vibrações do ar e ajudam a achar a presa no escuro.',
  mech:'Braços com juntas giratórias, pistão hidráulico e antenas de vibração.',spec:['Alcance 2,4 m','Atuador hidráulico'],
  view:{theta:0.95,phi:0.95,rf:0.62},anchor:[1.7,1.5,3.55]},
 {key:'quelas',name:'Quelas (pinças)',tag:'P',region:'#c4470c',
  text:'A “mão” da pinça, com um <b>dedo fixo</b> e um <b>dedo móvel</b>. Agarra e segura a presa. Dica geral (não é regra): pinças grossas e cauda fina costumam indicar veneno mais fraco; pinças finas e cauda grossa, veneno mais forte.',
  mech:'Garras de esmagamento em forma de mandíbula, com dentes de corte.',spec:['Força 6,5 kN','10 dentes'],
  view:{theta:0.5,phi:1.05,rf:0.55},anchor:[2.1,1.3,4.9]},
 {key:'pernas',name:'Pernas',tag:'P',region:'#ffc266',
  text:'4 pares de pernas para andar, cada uma com <b>7 artículos</b>: coxa, trocânter, fêmur, patela, tíbia, basitarso e tarso, que termina em garras. Sensores nas pernas percebem vibrações do solo.',
  mech:'Pernas altas com 7 módulos, pistões laranja e sapata de apoio.',spec:['8 × 7 juntas','Carga 2 t'],
  view:{theta:1.5,phi:1.15,rf:0.75},anchor:[2.05,2.35,2.55]},
 {key:'mesossoma',name:'Mesossoma',tag:'M',region:'#1f95c9',
  text:'Parte larga do abdômen, com <b>7 segmentos</b>. Guarda coração, intestino e órgãos reprodutores. Por baixo ficam o opérculo genital e <b>4 pares de estigmas</b>, as aberturas dos pulmões foliáceos por onde ele respira.',
  mech:'Chassi com o núcleo de energia protegido por 7 costelas blindadas; os estigmas viram entradas de ar.',spec:['Núcleo 48 kW','7 costelas'],
  view:{theta:2.0,phi:0.8,rf:0.65},anchor:[0.65,2.15,-0.5]},
 {key:'pentes',name:'Pentes',tag:'M',region:'#7cc9ea',
  text:'Órgãos <b>exclusivos dos escorpiões</b>, na barriga, logo atrás das pernas. Cheios de sensores químicos e de tato, “varrem” o chão para reconhecer o terreno, rastros de parceiros e o lugar certo para o espermatóforo.',
  mech:'Matriz de sensores que lê o solo.',spec:['2 × 10 sensores','Varredura do solo'],
  view:{theta:1.1,phi:2.25,rf:0.5},anchor:[0.85,0.62,0.8]},
 {key:'metassoma',name:'Metassoma (cauda)',tag:'T',region:'#d23c5a',
  text:'A “cauda” é, na verdade, a continuação do abdômen: <b>5 segmentos</b> articulados, com o ânus no último. Muito flexível, curva-se sobre o corpo para atacar ou se defender.',
  mech:'Braço de 5 módulos blindados ligados por dobradiças.',spec:['5 módulos','Giro 210°'],
  view:{theta:1.62,phi:1.25,rf:0.75}},
 {key:'telson',name:'Télson e aguilhão',tag:'T',region:'#9e2440',
  text:'Último segmento. A <b>vesícula</b> guarda as glândulas de veneno e o <b>aguilhão</b> (acúleo) o injeta. O escorpião dosa o veneno e pode até picar sem injetá-lo. No Brasil, o mais perigoso é o escorpião-amarelo (<i>Tityus serrulatus</i>): em caso de picada, procure atendimento — o soro é gratuito no SUS.',
  mech:'Tanque de veneno com visor e agulha injetora de ponta cromada.',spec:['Tanque 2 L','Ponta de cromo'],
  view:{theta:1.25,phi:1.15,rf:0.5}}
];
const PMAP={};PARTS.forEach((p,i)=>{p.i=i;PMAP[p.key]=p;});
const STEPS=[
 {t:'Chassi e núcleo de energia',p:'mesossoma'},{t:'Costelas blindadas',p:'mesossoma'},{t:'Pentes sensores',p:'pentes'},
 {t:'Carapaça',p:'carapaca'},{t:'Olhos (sensores)',p:'olhos'},{t:'Quelíceras',p:'queliceras'},
 {t:'Pernas (4 pares)',p:'pernas'},{t:'Pedipalpos',p:'pedipalpos'},{t:'Quelas (garras)',p:'quelas'},
 {t:'Metassoma: 5 módulos',p:'metassoma'},{t:'Télson: tanque e agulha',p:'telson'}];
const N=STEPS.length;

/* ================= Renderer / cena ================= */
const canvas=document.getElementById('c'),stage=document.getElementById('stage');
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});}
catch(e){fail('Seu navegador não conseguiu iniciar o WebGL, necessário para o modelo 3D.');return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(36,1,0.1,200);

// estúdio claro para reflexos
{
  const env=new THREE.Scene();
  const bg=new THREE.BoxGeometry(30,30,30,1,4,1);const bp=bg.attributes.position,cols=[];
  const top=new THREE.Color(0xffffff),mid=new THREE.Color(0xcfc7ba),bot=new THREE.Color(0x6e675d),c=new THREE.Color();
  for(let i=0;i<bp.count;i++){const y=bp.getY(i)/15;if(y>0)c.copy(mid).lerp(top,y);else c.copy(mid).lerp(bot,-y);cols.push(c.r,c.g,c.b);}
  bg.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
  env.add(new THREE.Mesh(bg,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide})));
  const panel=(w,h,p,col,k)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(col).multiplyScalar(k),side:THREE.DoubleSide}));m.position.set(p[0],p[1],p[2]);m.lookAt(0,0,0);env.add(m);};
  panel(12,5,[0,12,3],0xffffff,2.4);panel(4,9,[12,4,5],0xfff0de,1.8);panel(4,9,[-12,3,-5],0xe8eeff,1.5);panel(9,3,[0,4,-12],0xffffff,1.2);
  const pm=new THREE.PMREMGenerator(renderer);
  scene.environment=pm.fromScene(env,0.04).texture;pm.dispose();
}
const hemi=new THREE.HemisphereLight(0xffffff,0xb9ae9c,0.65);scene.add(hemi);
const key=new THREE.DirectionalLight(0xfff4e6,1.0);
key.position.set(6,13,8);key.castShadow=true;key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-9,right:9,top:9,bottom:-9,near:1,far:40});key.shadow.camera.updateProjectionMatrix();
key.shadow.bias=-0.0004;key.shadow.normalBias=0.02;key.shadow.radius=6;
key.target.position.set(0,0,0.8);scene.add(key);scene.add(key.target);
const rim=new THREE.DirectionalLight(0xffffff,0.35);rim.position.set(-7,6,-8);scene.add(rim);
const fill=new THREE.DirectionalLight(0xffe2c4,0.3);fill.position.set(-6,2,7);scene.add(fill);

const shadowPlane=new THREE.Mesh(new THREE.PlaneGeometry(26,26),new THREE.ShadowMaterial({opacity:0.22}));
shadowPlane.rotation.x=-PI/2;shadowPlane.position.set(0,0,0.8);shadowPlane.receiveShadow=true;scene.add(shadowPlane);
// sombra de contato suave
const ccv=document.createElement('canvas');ccv.width=ccv.height=128;{const x=ccv.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(60,50,40,0.28)');g.addColorStop(1,'rgba(60,50,40,0)');x.fillStyle=g;x.fillRect(0,0,128,128);}
const contact=new THREE.Mesh(new THREE.PlaneGeometry(7,10),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(ccv),transparent:true,depthWrite:false}));
contact.rotation.x=-PI/2;contact.position.set(0,0.002,0.6);scene.add(contact);
// rastro tracejado no chão
const trail=new THREE.Group();{
  const dm=new THREE.MeshBasicMaterial({color:0x3a342d,transparent:true,opacity:0.35,depthWrite:false});
  [[-1,-4.4,-0.5],[1,-4.6,0.6]].forEach(([sd,z0,bend])=>{
    for(let i=0;i<16;i++){const t=i/15,z=z0-t*7,x=sd*(0.6+t*2.2)+bend*t*t*2;
      const d=new THREE.Mesh(new THREE.PlaneGeometry(0.06,0.28),dm);d.rotation.x=-PI/2;d.rotation.z=Math.atan2(sd*2.2+bend*4*t,7);d.position.set(x,0.003,z);trail.add(d);}
  });}
scene.add(trail);

/* ================= Geometria ================= */
const GUN=0x4c5056,GUN2=0x5d6168,DARK=0x2e3135,STEEL=0x90969d,CHROME=0xe4e7ea,ORANGE=0xf26b1d,BLACK=0x19191b;
const CORE=0xff8a2a,EYE=0xffa040;
const v=p=>p instanceof V3?p.clone():new V3(p[0],p[1],p[2]);
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rand=rng(11);
function cyl(A,B,o){
  A=v(A);B=v(B);const d=B.clone().sub(A),L=d.length();d.normalize();
  const g=new THREE.CylinderGeometry(o.r2!=null?o.r2:o.r,o.r,L,o.n||8,1,false);
  if(o.rot)g.rotateY(o.rot);
  if(o.sx||o.sy)g.scale(o.sx||1,1,o.sy||1);
  const side=new V3().crossVectors(d,UP);if(side.lengthSq()<1e-6)side.set(1,0,0);side.normalize();
  const upp=new V3().crossVectors(side,d).normalize();
  const m=new THREE.Matrix4().makeBasis(side,d,upp);m.setPosition(A.add(B).multiplyScalar(0.5));
  g.applyMatrix4(m);return g;
}
const BOX={n:4,rot:PI/4};
function hinge(P,ax,r,len,n){P=v(P);return cyl(P.clone().addScaledVector(ax,-len/2),P.clone().addScaledVector(ax,len/2),{r,n:n||12});}
function box(c,s){const g=new THREE.BoxGeometry(s[0],s[1],s[2]);g.translate(c[0],c[1],c[2]);return g;}
function plate(pts,y0,th,bv){
  const sh=new THREE.Shape(pts.map(p=>new THREE.Vector2(p[0],-p[1])));
  const g=new THREE.ExtrudeGeometry(sh,{depth:th,bevelEnabled:bv>0,bevelThickness:bv,bevelSize:bv,bevelSegments:1,curveSegments:2});
  g.rotateX(-PI/2);g.translate(0,y0,0);return g;
}
function arch(Ro,th,ky,y0,zc,len,a0,a1,bv){
  const pts=[],n=18,Ri=Ro-th;
  for(let k=0;k<=n;k++){const a=a0+(a1-a0)*k/n;pts.push(new THREE.Vector2(Ro*Math.cos(a),Ro*Math.sin(a)*ky));}
  for(let k=n;k>=0;k--){const a=a0+(a1-a0)*k/n;pts.push(new THREE.Vector2(Ri*Math.cos(a),Ri*Math.sin(a)*ky));}
  const g=new THREE.ExtrudeGeometry(new THREE.Shape(pts),{depth:len,bevelEnabled:bv>0,bevelThickness:bv,bevelSize:bv,bevelSegments:1,curveSegments:1});
  g.translate(0,y0,zc-len/2);return g;
}
function mkCurve(pts){pts=pts.map(v);return pts.length===2?new THREE.LineCurve3(pts[0],pts[1]):new THREE.CatmullRomCurve3(pts,false,'centripetal');}
function tube(curve,o){
  o=Object.assign({segs:20,radial:4,sy:1},o);
  if(Array.isArray(curve))curve=mkCurve(curve);
  const pos=[],idx=[],T=new V3(),S=new V3(),U=new V3();
  for(let i=0;i<=o.segs;i++){
    const t=i/o.segs,P=curve.getPointAt(t);T.copy(curve.getTangentAt(t)).normalize();
    U.copy(UP).addScaledVector(T,-T.dot(UP));if(U.lengthSq()<1e-6)U.set(1,0,0).addScaledVector(T,-T.x);U.normalize();
    S.crossVectors(U,T).normalize();
    const r=o.r(t);
    for(let j=0;j<=o.radial;j++){const a=j/o.radial*PI*2+(o.rot||0),c=Math.cos(a),s=Math.sin(a);
      pos.push(P.x+(S.x*c+U.x*s*o.sy)*r,P.y+(S.y*c+U.y*s*o.sy)*r,P.z+(S.z*c+U.z*s*o.sy)*r);}
  }
  const R=o.radial+1;
  for(let i=0;i<o.segs;i++)for(let j=0;j<o.radial;j++){const a=i*R+j,b=a+R,c=b+1,d=a+1;idx.push(a,d,b,d,c,b);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();return g;
}
function M(){const L=[];return{a(g,c){L.push([g,c]);return this;},geo(){return merge(L);}};}
function merge(L){
  const pos=[],col=[],c=new THREE.Color();
  for(const [g0,hex] of L){const g=g0.index?g0.toNonIndexed():g0,p=g.attributes.position;c.set(hex==null?0xffffff:hex);
    for(let i=0;i<p.count;i++){pos.push(p.getX(i),p.getY(i),p.getZ(i));col.push(c.r,c.g,c.b);}}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.computeVertexNormals();return g;
}

const halos=[];
function halo(mesh,world,scale,op){const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:haloTex,transparent:true,depthWrite:false,opacity:op}));

function add(geo,part,o){
  o=o||{};

  geo.translate(-center.x,-center.y,-center.z);geo.computeBoundingSphere();
  const glow=o.glow!=null;
  const mat=new THREE.MeshStandardMaterial({
    color:glow?new THREE.Color(o.glow).lerp(new THREE.Color(0xffffff),0.35):(o.vc?0xffffff:(o.color!=null?o.color:GUN)),vertexColors:!!o.vc&&!glow,
    metalness:glow?0.0:(o.metal!=null?o.metal:0.62),roughness:glow?0.35:(o.rough!=null?o.rough:0.42),flatShading:true});
  const m=new THREE.Mesh(geo,mat);m.position.copy(center);

  const ex=(o.ex||new V3()).clone();
  m.userData={part,vc:!!o.vc&&!glow,base:mat.color.clone(),glow,glowC:new THREE.Color(glow?o.glow:0),gi:o.gi||1,phase:rand()*6,
    ex,D:ex.clone().multiplyScalar(2.1).add(LIFT),home:m.position.clone(),hq:m.quaternion.clone(),rad:geo.boundingSphere.radius,em:0,
    axis:new V3(rand()-0.5,rand()-0.5,rand()-0.5).normalize(),spin:(0.6+rand()*0.9)*(rand()<0.5?-1:1),
    step:curStep,sub:curSub,emC:new THREE.Color(0),ei:0,land:-1e9,prevL:0,flashing:false};

    og.gain.setValueAtTime((out?0.04:0.08)/(i+1),t);og.gain.exponentialRampToValueAtTime(0.0008,t+0.22);o.connect(og);og.connect(actx.destination);o.start(t);o.stop(t+0.24);});
  const o=actx.createOscillator(),og=actx.createGain();o.type='triangle';
  o.frequency.setValueAtTime(out?420:160,t);o.frequency.exponentialRampToValueAtTime(out?260:50,t+0.1);
  og.gain.setValueAtTime(out?0.06:0.24,t);og.gain.exponentialRampToValueAtTime(0.001,t+0.14);
  o.connect(og);og.connect(actx.destination);o.start(t);o.stop(t+0.15);
}

/* ================= Loop ================= */
function resize(){
  const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;
  const wasP=camera.aspect<0.95;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  smMat.uniforms.uScale.value=h*renderer.getPixelRatio()/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)));
  if(!resize.done){const vw=defView();cam.theta=goal.theta=vw.theta;cam.phi=goal.phi=vw.phi;resize.done=true;}
  else if(wasP!==portrait()&&!st.sel&&!st.view)setGoalView(defView());
}
new ResizeObserver(resize).observe(stage);resize();

const tmp=new V3(),qtmp=new THREE.Quaternion(),FLASH=new THREE.Color(0xff9a40);let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(!st.dragging&&st.prog!==st.target){
    const sp=st.target>st.prog?1.0:1.7;
    st.prog=st.target>st.prog?Math.min(st.target,st.prog+dt*sp):Math.max(st.target,st.prog-dt*sp);
  }
  if(!st.dragging)slider.value=st.prog;
  bBuild.setAttribute('aria-pressed',st.target>st.prog);bBreak.setAttribute('aria-pressed',st.target<st.prog);
  const e=1-st.prog/N,curIdx=Math.min(N-1,Math.floor(st.prog));
  stepTxt.innerHTML=st.prog>=N-0.001?'Montado ✓ <span>· toque numa peça</span>':st.prog<=0.001?'Desmontado <span>· aperte Montar ou arraste</span>':'Passo '+(curIdx+1)+'/'+N+' <span>· '+STEPS[curIdx].t+'</span>';
  meshes.forEach(m=>{
    const u=m.userData;
    const L=Math.min(1,Math.max(0,(st.prog-(u.step+u.sub*0.55))/0.45));
    const c1=1.70158,c3=c1+1,back=L>=1?1:1+c3*Math.pow(L-1,3)+c1*Math.pow(L-1,2);
    m.position.copy(u.home).addScaledVector(u.D,1-back);
    if(L<1)m.position.y+=Math.sin(PI*L)*0.4*(1-L);
    const sa=Math.pow(1-L,3)*u.spin;
    if(sa!==0){qtmp.setFromAxisAngle(u.axis,sa);m.quaternion.copy(u.hq).premultiply(qtmp);}else m.quaternion.copy(u.hq);
    // fumaça enquanto a peça viaja
    if(L>0.02&&L<0.98&&st.prog!==st.target&&!st.dragging){u.em+=dt*16;while(u.em>=1){u.em-=1;puff(m.position,u.rad*0.9,0.35+u.rad*0.3,0.1);}}
    if(L>=1&&u.prevL<1){u.land=now;clank(false);for(let k=0;k<5;k++)puff(m.position,u.rad*1.1,0.3+u.rad*0.25,0.3);}
    else if(L<1&&u.prevL>=1){clank(true);for(let k=0;k<4;k++)puff(m.position,u.rad,0.3+u.rad*0.25,0.3);}
    u.prevL=L;
    if(u.ghost){const op=0.12*(1-L);u.ghost.material.opacity=op;u.ghost.visible=op>0.004;}
    const f=Math.exp(-(now-u.land)/200);
    if(f>0.03&&!u.glow){m.material.emissive.copy(FLASH);m.material.emissiveIntensity=u.ei+f*0.7;u.flashing=true;}
    else{
      if(u.flashing){u.flashing=false;m.material.emissive.copy(u.emC);}
      if(u.glow)m.material.emissiveIntensity=u.ei*(0.82+0.18*Math.sin(now*0.003+u.phase));
      else if(st.sel===u.part)m.material.emissiveIntensity=u.ei*(0.72+0.28*Math.sin(now*0.0045));
      else m.material.emissiveIntensity=u.ei;
    }
  });
  updSmoke(dt);
  if(st.rot&&!st.sel&&!st.view&&!pointers.size&&now-lastInteract>2500)goal.theta+=dt*0.14;
  if(st.sel){const p=PMAP[st.sel];goal.target.copy(p.a).add(p.m.position).sub(p.m.userData.home);goal.target.x*=0.35;}
  else{const w=st.view&&VIEWS.find(x=>x.k===st.view);if(w&&w.t)goal.target.set(w.t[0],w.t[1],w.t[2]);else goal.target.copy(DEF_T);goal.target.y+=0.8*e;}
  const k=Math.min(1,dt*5);
  cam.theta+=(goal.theta-cam.theta)*k;cam.phi+=(goal.phi-cam.phi)*k;cam.rf+=(goal.rf-cam.rf)*k;cam.target.lerp(goal.target,k);
  const R=baseR()*cam.rf*(1+0.3*e);
  camera.position.set(cam.target.x+R*Math.sin(cam.phi)*Math.sin(cam.theta),cam.target.y+R*Math.cos(cam.phi),cam.target.z+R*Math.sin(cam.phi)*Math.cos(cam.theta));
  camera.lookAt(cam.target);
  const below=camera.position.y<0.05;shadowPlane.visible=!below;trail.visible=!below&&!st.night;contact.visible=!below&&!st.night;
  renderer.render(scene,camera);
  const w=stage.clientWidth,h=stage.clientHeight;
  PARTS.forEach(p=>{
    const building=st.target!==st.prog&&st.prog>0&&st.prog<N&&STEPS[curIdx].p===p.key;
    const show=st.labels||st.sel===p.key||building;
    tmp.copy(p.a).add(p.m.position).sub(p.m.userData.home).project(camera);
    const vis=show&&tmp.z<1&&Math.abs(tmp.x)<1.1&&Math.abs(tmp.y)<1.1;
    p.lbl.classList.toggle('show',vis);p.lbl.style.pointerEvents=vis?'auto':'none';
    if(vis){p.lbl.style.left=((tmp.x+1)/2*w)+'px';p.lbl.style.top=((1-tmp.y)/2*h)+'px';}
  });
  requestAnimationFrame(frame);
}
updateLook();renderCard();requestAnimationFrame(frame);
setTimeout(()=>{if(st.target===0&&st.prog===0)st.target=N;},700);
}
